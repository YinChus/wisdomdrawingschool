<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智绘书院 — 登录</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#a855f7 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:#fff;border-radius:16px;padding:40px 36px;width:380px;max-width:95vw;box-shadow:0 24px 80px rgba(0,0,0,.25);}
.logo{text-align:center;margin-bottom:28px;}
.logo .icon{font-size:48px;margin-bottom:8px;}
.logo h1{font-size:22px;font-weight:700;color:#1e293b;}
.logo p{font-size:13px;color:#64748b;margin-top:4px;}
.form-row{margin-bottom:16px;}
.form-row label{display:block;font-size:12px;color:#64748b;margin-bottom:5px;font-weight:500;}
.form-row input,.form-row select{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none;transition:border-color .15s;}
.form-row input:focus,.form-row select:focus{border-color:#6366f1;}
.btn-login{width:100%;padding:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;transition:opacity .15s;}
.btn-login:hover{opacity:.9;}
.btn-login:disabled{opacity:.5;cursor:not-allowed;}
.error{background:#fee2e2;color:#dc2626;border-radius:6px;padding:9px 12px;font-size:13px;margin-bottom:14px;display:none;}
.role-tips{margin-top:20px;border-top:1px solid #f1f5f9;padding-top:16px;}
.role-tips p{font-size:11px;color:#94a3b8;margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.role-tip{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px;color:#64748b;}
.role-badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:700;}
.rb-admin{background:#fef3c7;color:#92400e;}
.rb-teacher{background:#dbeafe;color:#1d4ed8;}
.rb-student{background:#dcfce7;color:#16a34a;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="icon">🎨</div>
    <h1>智绘书院</h1>
    <p>数学可视化教学平台</p>
  </div>
  <div class="error" id="error-msg"></div>
  <div class="form-row">
    <label>用户名</label>
    <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
  </div>
  <div class="form-row">
    <label>密码</label>
    <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
  </div>
  <button class="btn-login" id="btn-login" onclick="doLogin()">登 录</button>

  <div class="role-tips">
    <p>默认账号</p>
    <div class="role-tip"><span class="role-badge rb-admin">管理员</span> admin / admin123</div>
    <div class="role-tip"><span class="role-badge rb-teacher">教师</span> teacher / teacher123</div>
    <div class="role-tip"><span class="role-badge rb-student">学生</span> student / student123</div>
  </div>
</div>

<script>
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const errEl = document.getElementById('error-msg');
  const btn = document.getElementById('btn-login');
  errEl.style.display = 'none';
  if (!username || !password) { showErr('请输入用户名和密码'); return; }
  btn.disabled = true; btn.textContent = '登录中…';
  try {
    const r = await fetch('/api/academy/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username, password }),
    });
    const d = await r.json();
    if (!r.ok) { showErr(d.detail || '用户名或密码错误'); return; }
    // 保存到 sessionStorage
    sessionStorage.setItem('academy_user', JSON.stringify(d.user));
    // 按角色跳转
    const role = d.user.role;
    if (role === 'admin')   location.href = '/academy-admin.html';
    else if (role === 'teacher') location.href = '/academy.html';
    else location.href = '/academy-student.html';
  } catch(e) {
    showErr('登录失败：' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '登 录';
  }
}

function showErr(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.style.display = 'block';
}
</script>
</body>
</html>
